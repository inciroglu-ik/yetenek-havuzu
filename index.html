<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yetenek Havuzu Değerlendirme</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23a9772c'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-size='26' font-weight='700' fill='white' text-anchor='middle'%3E%C4%B0H%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
  /* İnciroğlu tasarım dili 2026 · Konsept 2 "Grafit Kurumsal" (İK Dashboard ile aynı): lacivert + çelik mavisi,
     sarı/pirinç ve yeşil yok (--brass adı korunur, değeri çelik mavisi; olumlu durum = mavi) */
  :root{
    --ink:#151a23;
    --ink-soft:#4f5868;
    --paper:#f5f7fa;
    --panel:#ffffff;
    --line:#e4e8ee;
    --navy:#132a46;
    --navy-deep:#0e1218;
    --brass:#2563ab;
    --brass-soft:#e2edfb;
    --good:#2259a0;
    --good-bg:#e0eaf8;
    --warn:#a15c1f;
    --warn-bg:#f7ead9;
    --bad:#a13030;
    --bad-bg:#f8e6e6;
    --radius:10px;
    --shadow:0 1px 2px rgba(28,37,48,.06), 0 8px 24px -12px rgba(28,37,48,.12);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--paper);color:var(--ink);}
  h1,h2,h3,.serif{font-family:'Source Serif 4',Georgia,serif;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;font-size:14px;}
  ::selection{background:var(--brass-soft);}

  /* ---------- layout shells ---------- */
  #app{min-height:100vh;}
  .center-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:
    radial-gradient(1200px 600px at 15% -10%, #2c3a56 0%, transparent 60%),
    linear-gradient(160deg, var(--navy-deep), var(--navy) 70%);}
  .login-card{background:var(--panel);border-radius:16px;box-shadow:var(--shadow);width:100%;max-width:380px;padding:36px 32px;}
  .login-brand{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
  .login-brand .mark{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--brass),#5b97e0);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;}
  .login-brand .name{font-size:14px;font-weight:700;letter-spacing:.02em;color:var(--navy);}
  .login-brand .sub{font-size:11px;color:var(--ink-soft);}
  .login-card h1{font-size:22px;margin:0 0 4px;color:var(--navy);}
  .login-card p.hint{margin:0 0 22px;color:var(--ink-soft);font-size:13px;line-height:1.5;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;}
  .field input, .field select, .field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fdfcfa;color:var(--ink);transition:border-color .15s;}
  .field input:focus, .field select:focus, .field textarea:focus{outline:none;border-color:var(--brass);box-shadow:0 0 0 3px var(--brass-soft);}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:8px;border:none;font-weight:600;font-size:14px;transition:transform .1s, background .15s;}
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--navy);color:#fff;width:100%;}
  .btn-primary:hover{background:var(--navy-deep);}
  .btn-brass{background:var(--brass);color:#fff;}
  .btn-brass:hover{background:#1d4f8c;}
  .btn-ghost{background:transparent;color:var(--navy);border:1px solid var(--line);}
  .btn-ghost:hover{background:#fff;}
  .btn-sm{padding:6px 12px;font-size:13px;border-radius:7px;}
  .btn-danger{background:var(--bad-bg);color:var(--bad);}
  .error-box{background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:14px;display:none;}
  .login-foot{margin-top:18px;font-size:11.5px;color:#9aa2ad;text-align:center;}

  /* ---------- app shell ---------- */
  .topbar{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:0 22px;display:flex;align-items:center;justify-content:space-between;height:58px;box-shadow:0 2px 10px rgba(0,0,0,.12);}
  .topbar .brand{display:flex;align-items:center;gap:10px;}
  .topbar .brand .mark{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,var(--brass),#5b97e0);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;}
  .topbar .brand .t{font-size:14.5px;font-weight:700;letter-spacing:.01em;}
  .topbar .brand .t small{display:block;font-weight:400;font-size:10.5px;color:#b7c0d1;letter-spacing:.03em;}
  .topbar .who{display:flex;align-items:center;gap:14px;font-size:13px;color:#dbe1ea;}
  .topbar .who b{color:#fff;}
  .pill{padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:rgba(255,255,255,.12);}
  .wrap{max-width:1180px;margin:0 auto;padding:26px 22px 60px;}
  .wrap.wide{max-width:1560px;}

  /* ---------- misc components ---------- */
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:20px;}
  .page-head h1{font-size:23px;margin:0 0 4px;color:var(--navy);}
  .page-head p{margin:0;color:var(--ink-soft);font-size:13.5px;}
  .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:22px;}
  .stat-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;}
  .stat-card .n{font-family:'Source Serif 4',serif;font-size:26px;font-weight:700;color:var(--navy);line-height:1;}
  .stat-card .l{margin-top:6px;font-size:11.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;}

  /* ---------- Açıklamalar: değerlendirme skalası ---------- */
  .sk-wrap{max-width:1060px;display:grid;gap:18px;}
  .sk-kart{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px 24px;}
  .sk-ust{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brass);}
  .sk-kart h2{font-size:20px;margin:4px 0 6px;color:var(--navy);}
  .sk-not{margin:0 0 14px;font-size:13px;color:var(--ink-soft);}
  .sk-satir{display:grid;grid-template-columns:230px 1fr;gap:18px;padding:14px 0;border-top:1px solid var(--line);}
  .sk-ad{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--navy);font-size:14.5px;align-self:start;}
  .sk-rozet{flex:0 0 26px;width:26px;height:26px;border-radius:7px;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-family:'Source Serif 4',Georgia,serif;font-weight:700;font-size:15px;}
  .sk-madde{margin:0;padding-left:18px;font-size:13.5px;line-height:1.7;color:var(--ink);}
  .sk-seviye{padding:16px 0 8px;border-top:1px solid var(--line);}
  .sk-seviye-bas{display:flex;align-items:center;gap:10px;font-family:'Source Serif 4',Georgia,serif;font-size:17px;font-weight:700;color:var(--navy);margin-bottom:12px;}
  .sk-barlar{display:grid;gap:8px;}
  .sk-bar{background:var(--navy);color:#fff;border-radius:10px;padding:10px 16px;font-size:13.5px;line-height:1.5;}
  @media (max-width:720px){ .sk-satir{grid-template-columns:1fr;gap:8px;} .sk-kart{padding:18px 16px;} }

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
  .toolbar input, .toolbar select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:13px;}

  .card-list{display:grid;gap:10px;}
  .emp-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;transition:border-color .15s;}
  .emp-card:hover{border-color:#a9bdd8;}
  .emp-card .main b{font-size:14.5px;color:var(--ink);}
  .emp-card .main .meta{font-size:12px;color:var(--ink-soft);margin-top:3px;}
  .status-badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;display:inline-block;}
  .status-tamamlandi{background:var(--good-bg);color:var(--good);}
  .status-taslak{background:var(--warn-bg);color:var(--warn);}
  .status-bekliyor{background:#eee;color:#777;}

  table{width:100%;border-collapse:collapse;font-size:12.8px;background:var(--panel);}
  table th{text-align:left;padding:9px 10px;background:#eef0f4;color:var(--navy);font-size:11px;text-transform:uppercase;letter-spacing:.03em;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2;}
  table td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
  table.admin-table{table-layout:fixed;}
  table.admin-table th, table.admin-table td{font-size:11px;padding:7px 6px;word-wrap:break-word;overflow-wrap:break-word;line-height:1.3;}
  table.admin-table th{overflow-wrap:normal;word-wrap:normal;word-break:keep-all;font-size:10px;letter-spacing:.02em;}
  table.admin-table{min-width:1250px !important;}
  .table-scroll.no-x-scroll{overflow-x:hidden;}
  .table-scroll{overflow:auto;border:1px solid var(--line);border-radius:12px;max-height:70vh;position:relative;}

  /* modal / drawer */
  .overlay{position:fixed;inset:0;background:rgba(22,29,43,.55);z-index:50;display:flex;justify-content:flex-end;}
  .drawer{background:var(--paper);width:min(720px,100%);height:100%;overflow-y:auto;box-shadow:-8px 0 30px rgba(0,0,0,.2);}
  .drawer-head{position:sticky;top:0;background:var(--navy);color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:flex-start;z-index:5;}
  .drawer-head h2{margin:0;font-size:18px;}
  .drawer-head .meta{font-size:12px;color:#c3cbdb;margin-top:4px;}
  .drawer-body{padding:22px 24px 90px;}
  .close-x{background:rgba(255,255,255,.12);border:none;color:#fff;width:30px;height:30px;border-radius:8px;font-size:16px;}

  .section-title{font-size:13px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.05em;margin:26px 0 12px;padding-bottom:8px;border-bottom:2px solid var(--brass-soft);}
  .section-title:first-child{margin-top:0;}
  .comp-row{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;}
  .comp-row .q{font-size:13.5px;font-weight:600;color:var(--ink);margin-bottom:8px;}
  .seg{display:flex;gap:6px;flex-wrap:wrap;}
  .seg button{flex:1;min-width:64px;padding:7px 6px;border:1px solid var(--line);background:#fff;border-radius:7px;font-size:12px;font-weight:600;color:var(--ink-soft);}
  .seg button.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .seg.two button{flex:none;min-width:90px;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media (max-width:560px){.two-col{grid-template-columns:1fr;}}

  .summary-box{background:linear-gradient(135deg,var(--navy),var(--navy-deep));color:#fff;border-radius:12px;padding:16px 18px;margin:20px 0;}
  .summary-box .row{display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.12);}
  .summary-box .row:last-child{border-bottom:none;}
  .summary-box .row b{color:#c3d9f6;}
  .verdict{margin-top:10px;padding:9px 12px;border-radius:8px;font-size:12.5px;font-weight:700;text-align:center;}
  .verdict.ok{background:var(--good-bg);color:var(--good);}
  .verdict.dev{background:var(--warn-bg);color:var(--warn);}

  .drawer-foot{position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:14px 24px;display:flex;gap:10px;justify-content:flex-end;}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy-deep);color:#fff;padding:11px 20px;border-radius:9px;font-size:13.5px;box-shadow:var(--shadow);z-index:100;display:none;}
  .empty-state{text-align:center;padding:50px 20px;color:var(--ink-soft);}
  .checklist{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:10px;background:#fff;}
  .checklist label{display:flex;gap:8px;align-items:flex-start;font-size:12.8px;color:var(--ink);}
  .checklist label small{display:block;color:var(--ink-soft);}
  .link-btn{background:none;border:none;color:var(--navy);text-decoration:underline;font-size:13px;padding:0;}
  .tag{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:20px;background:#eef0f4;color:var(--navy-deep);margin-right:4px;}
  .admin-panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:640px){.grid2{grid-template-columns:1fr;}}
  .loader{display:flex;align-items:center;justify-content:center;min-height:60vh;color:var(--ink-soft);font-size:14px;}

  /* ---------- overview dashboard ---------- */
  .chart-grid{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:14px;margin-bottom:20px;}
  @media(max-width:900px){.chart-grid{grid-template-columns:1fr;}}
  .chart-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;}
  .chart-card h3{margin:0 0 14px;font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--navy);font-family:'Inter',sans-serif;font-weight:700;}
  .chart-grid.uc{grid-template-columns:repeat(3,1fr);}
  @media(max-width:900px){.chart-grid.uc{grid-template-columns:1fr;}}
  .risk-kart h3{margin-bottom:4px;}
  .ck-alt{font-size:12px;color:var(--ink-soft);margin:0 0 12px;line-height:1.45;}
  .ck-bos{font-size:13px;color:var(--ink-soft);padding:28px 0;text-align:center;}
  .ck-bolum{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brass);margin:4px 0 10px;}
  .kapsam-tbl{width:100%;border-collapse:collapse;font-size:12.5px;background:transparent;}
  .kapsam-tbl th{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);font-weight:700;text-align:right;padding:0 6px 8px;border-bottom:1px solid var(--line);background:transparent;}
  .kapsam-tbl td{padding:7px 6px;border-bottom:1px solid #efebe2;text-align:right;font-variant-numeric:tabular-nums;font-weight:600;color:var(--navy);}
  .kapsam-tbl td:first-child{text-align:left;font-weight:500;color:var(--ink);white-space:nowrap;}
  .kapsam-tbl th{white-space:nowrap;}
  .chart-grid.ilk{grid-template-columns:1.1fr 1fr 1.2fr;}
  @media(max-width:900px){.chart-grid.ilk{grid-template-columns:1fr;}}
  .kapsam-tbl tr.ana td{font-weight:700;}
  .ck-not{font-size:11.5px;color:var(--ink-soft);margin-top:10px;line-height:1.45;}
  /* ---------- Komuta merkezi (admin Genel Bakış, 09.11.2026) ---------- */
  .sekme{display:none;}
  .kpi-serit{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:18px;}
  @media(max-width:1200px){.kpi-serit{grid-template-columns:repeat(3,minmax(0,1fr));}}
  @media(max-width:620px){.kpi-serit{grid-template-columns:repeat(2,minmax(0,1fr));}}
  .kpi{position:relative;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px 13px;display:flex;flex-direction:column;gap:4px;font-family:inherit;color:inherit;transition:border-color .15s, box-shadow .15s, transform .1s;min-width:0;}
  button.kpi{cursor:pointer;}
  button.kpi:hover{border-color:#a9bdd8;box-shadow:0 6px 18px -10px rgba(19,42,70,.35);}
  button.kpi:hover::after{content:"Listeyi aç →";position:absolute;bottom:10px;right:14px;font-size:10.5px;font-weight:600;color:var(--brass);background:var(--panel);padding-left:6px;}
  button.kpi:focus-visible,.mgr-row:focus-visible,.hm-cell:focus-visible,.mini-kpi:focus-visible,.chip:focus-visible{outline:2px solid var(--brass);outline-offset:2px;}
  .kpi-l{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);line-height:1.3;min-height:2.6em;}
  .kpi-n{font-family:'Source Serif 4',Georgia,serif;font-size:30px;font-weight:700;color:var(--navy);line-height:1.05;}
  .kpi-n small{font-family:'Inter',sans-serif;font-size:13px;font-weight:700;color:var(--brass);margin-left:8px;}
  .kpi-n.kucuk{font-size:21px;padding:5px 0 3px;}
  .kpi-a{font-size:11.5px;color:var(--ink-soft);line-height:1.35;}
  .kpi-bar{height:6px;border-radius:4px;background:#e6ebf2;overflow:hidden;margin:3px 0 2px;}
  .kpi-bar i{display:block;height:100%;background:var(--brass);border-radius:4px;}
  .kpi.vurgu{border-top:3px solid var(--brass);}
  .kpi.dikkat{border-top:3px solid #c9831c;}
  .kpi.dikkat .kpi-a{color:#8a560d;font-weight:600;}
  .kpi.bilgi{background:#f8fafc;}
  .ov-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;margin-bottom:18px;}
  .pnl{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0;}
  .span4{grid-column:span 4;}.span6{grid-column:span 6;}.span8{grid-column:span 8;}
  @media(max-width:1100px){.span4,.span6,.span8{grid-column:span 12;}}
  .pnl-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px;}
  .pnl-h h3{margin:0;font-family:'Inter',sans-serif;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--navy);}
  .pnl-h p{margin:3px 0 0;font-size:12px;color:var(--ink-soft);line-height:1.4;}
  .pnl-link{flex:none;background:none;border:none;color:var(--brass);font-size:12.5px;font-weight:600;padding:2px 0;cursor:pointer;white-space:nowrap;}
  .pnl-link:hover{text-decoration:underline;}
  .mgr-list{display:flex;flex-direction:column;}
  .mgr-row{display:grid;grid-template-columns:minmax(150px,1.4fr) minmax(90px,1.6fr) 56px 92px;align-items:center;gap:12px;padding:8px 6px;border:none;border-top:1px solid #eef1f5;background:none;text-align:left;font-family:inherit;cursor:pointer;border-radius:6px;}
  .mgr-row:first-child{border-top:none;}
  .mgr-row:hover{background:#f3f6fb;}
  .mr-ad{font-size:13px;font-weight:600;color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .mr-ad small{display:block;font-size:11px;font-weight:500;color:var(--ink-soft);}
  .mr-bar{height:8px;border-radius:5px;background:#e6ebf2;overflow:hidden;}
  .mr-bar i{display:block;height:100%;border-radius:5px;}
  .mr-say{font-size:12px;color:var(--ink-soft);text-align:right;font-variant-numeric:tabular-nums;}
  .mr-say b{color:var(--navy);font-size:13px;}
  .mr-bek{font-size:11.5px;font-weight:700;color:var(--bad);text-align:right;white-space:nowrap;}
  .mr-bek.ok{color:var(--good);}
  .bos-not{font-size:12.5px;color:var(--ink-soft);padding:10px 2px;}
  .hm-wrap{display:flex;gap:8px;align-items:stretch;}
  .hm-y{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);text-align:center;}
  .hm-grid{flex:1;display:grid;grid-template-columns:62px repeat(3,minmax(0,1fr));gap:6px;}
  .hm-rl{display:flex;align-items:center;font-size:11.5px;font-weight:700;color:var(--navy);}
  .hm-cl{text-align:center;font-size:11px;font-weight:600;color:var(--ink-soft);}
  .hm-x{text-align:right;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);margin-top:4px;}
  .hm-cell{position:relative;min-height:66px;border:none;border-radius:8px;padding:8px 9px;text-align:left;font-family:inherit;color:#fff;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;background:var(--c);overflow:hidden;transition:transform .1s;}
  .hm-cell::before{content:"";position:absolute;inset:0;background:#fff;opacity:calc(1 - var(--a));}
