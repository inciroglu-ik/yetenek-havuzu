<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yetenek Havuzu Değerlendirme</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c2530;
    --ink-soft:#4a5568;
    --paper:#f6f5f1;
    --panel:#ffffff;
    --line:#e2ddd2;
    --navy:#233047;
    --navy-deep:#161d2b;
    --brass:#a9772c;
    --brass-soft:#eadfc8;
    --good:#3d7a52;
    --good-bg:#e7f2ea;
    --warn:#a15c1f;
    --warn-bg:#f7ead9;
    --bad:#a13030;
    --bad-bg:#f8e6e6;
    --radius:10px;
    --shadow:0 1px 2px rgba(28,37,48,.06), 0 8px 24px -12px rgba(28,37,48,.12);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--paper);color:var(--ink);}
  h1,h2,h3,.serif{font-family:'Source Serif 4',Georgia,serif;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;font-size:14px;}
  ::selection{background:var(--brass-soft);}

  /* ---------- layout shells ---------- */
  #app{min-height:100vh;}
  .center-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:
    radial-gradient(1200px 600px at 15% -10%, #2c3a56 0%, transparent 60%),
    linear-gradient(160deg, var(--navy-deep), var(--navy) 70%);}
  .login-card{background:var(--panel);border-radius:16px;box-shadow:var(--shadow);width:100%;max-width:380px;padding:36px 32px;}
  .login-brand{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
  .login-brand .mark{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--brass),#c9954b);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;}
  .login-brand .name{font-size:14px;font-weight:700;letter-spacing:.02em;color:var(--navy);}
  .login-brand .sub{font-size:11px;color:var(--ink-soft);}
  .login-card h1{font-size:22px;margin:0 0 4px;color:var(--navy);}
  .login-card p.hint{margin:0 0 22px;color:var(--ink-soft);font-size:13px;line-height:1.5;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;}
  .field input, .field select, .field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fdfcfa;color:var(--ink);transition:border-color .15s;}
  .field input:focus, .field select:focus, .field textarea:focus{outline:none;border-color:var(--brass);box-shadow:0 0 0 3px var(--brass-soft);}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:8px;border:none;font-weight:600;font-size:14px;transition:transform .1s, background .15s;}
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--navy);color:#fff;width:100%;}
  .btn-primary:hover{background:var(--navy-deep);}
  .btn-brass{background:var(--brass);color:#fff;}
  .btn-brass:hover{background:#946222;}
  .btn-ghost{background:transparent;color:var(--navy);border:1px solid var(--line);}
  .btn-ghost:hover{background:#fff;}
  .btn-sm{padding:6px 12px;font-size:13px;border-radius:7px;}
  .btn-danger{background:var(--bad-bg);color:var(--bad);}
  .error-box{background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:14px;display:none;}
  .login-foot{margin-top:18px;font-size:11.5px;color:#9aa2ad;text-align:center;}

  /* ---------- app shell ---------- */
  .topbar{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:0 22px;display:flex;align-items:center;justify-content:space-between;height:58px;box-shadow:0 2px 10px rgba(0,0,0,.12);}
  .topbar .brand{display:flex;align-items:center;gap:10px;}
  .topbar .brand .mark{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,var(--brass),#c9954b);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;}
  .topbar .brand .t{font-size:14.5px;font-weight:700;letter-spacing:.01em;}
  .topbar .brand .t small{display:block;font-weight:400;font-size:10.5px;color:#b7c0d1;letter-spacing:.03em;}
  .topbar .who{display:flex;align-items:center;gap:14px;font-size:13px;color:#dbe1ea;}
  .topbar .who b{color:#fff;}
  .pill{padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:rgba(255,255,255,.12);}
  .wrap{max-width:1180px;margin:0 auto;padding:26px 22px 60px;}

  /* ---------- misc components ---------- */
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:20px;}
  .page-head h1{font-size:23px;margin:0 0 4px;color:var(--navy);}
  .page-head p{margin:0;color:var(--ink-soft);font-size:13.5px;}
  .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:22px;}
  .stat-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;}
  .stat-card .n{font-family:'Source Serif 4',serif;font-size:26px;font-weight:700;color:var(--navy);line-height:1;}
  .stat-card .l{margin-top:6px;font-size:11.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
  .toolbar input, .toolbar select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:13px;}

  .card-list{display:grid;gap:10px;}
  .emp-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;transition:border-color .15s;}
  .emp-card:hover{border-color:#c9c2af;}
  .emp-card .main b{font-size:14.5px;color:var(--ink);}
  .emp-card .main .meta{font-size:12px;color:var(--ink-soft);margin-top:3px;}
  .status-badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.03em;}
  .status-tamamlandi{background:var(--good-bg);color:var(--good);}
  .status-taslak{background:var(--warn-bg);color:var(--warn);}
  .status-bekliyor{background:#eee;color:#777;}

  table{width:100%;border-collapse:collapse;font-size:12.8px;background:var(--panel);}
  table th{text-align:left;padding:9px 10px;background:#eef0f4;color:var(--navy);font-size:11px;text-transform:uppercase;letter-spacing:.03em;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2;}
  table td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
  table.admin-table{table-layout:fixed;}
  table.admin-table th, table.admin-table td{font-size:11px;padding:7px 6px;word-wrap:break-word;overflow-wrap:break-word;line-height:1.3;}
  .table-scroll.no-x-scroll{overflow-x:hidden;}
  .table-scroll{overflow:auto;border:1px solid var(--line);border-radius:12px;max-height:70vh;position:relative;}

  /* modal / drawer */
  .overlay{position:fixed;inset:0;background:rgba(22,29,43,.55);z-index:50;display:flex;justify-content:flex-end;}
  .drawer{background:var(--paper);width:min(720px,100%);height:100%;overflow-y:auto;box-shadow:-8px 0 30px rgba(0,0,0,.2);}
  .drawer-head{position:sticky;top:0;background:var(--navy);color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:flex-start;z-index:5;}
  .drawer-head h2{margin:0;font-size:18px;}
  .drawer-head .meta{font-size:12px;color:#c3cbdb;margin-top:4px;}
  .drawer-body{padding:22px 24px 90px;}
  .close-x{background:rgba(255,255,255,.12);border:none;color:#fff;width:30px;height:30px;border-radius:8px;font-size:16px;}

  .section-title{font-size:13px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.05em;margin:26px 0 12px;padding-bottom:8px;border-bottom:2px solid var(--brass-soft);}
  .section-title:first-child{margin-top:0;}
  .comp-row{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;}
  .comp-row .q{font-size:13.5px;font-weight:600;color:var(--ink);margin-bottom:8px;}
  .seg{display:flex;gap:6px;flex-wrap:wrap;}
  .seg button{flex:1;min-width:64px;padding:7px 6px;border:1px solid var(--line);background:#fff;border-radius:7px;font-size:12px;font-weight:600;color:var(--ink-soft);}
  .seg button.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .seg.two button{flex:none;min-width:90px;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media (max-width:560px){.two-col{grid-template-columns:1fr;}}

  .summary-box{background:linear-gradient(135deg,var(--navy),var(--navy-deep));color:#fff;border-radius:12px;padding:16px 18px;margin:20px 0;}
  .summary-box .row{display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.12);}
  .summary-box .row:last-child{border-bottom:none;}
  .summary-box .row b{color:#f1d9a8;}
  .verdict{margin-top:10px;padding:9px 12px;border-radius:8px;font-size:12.5px;font-weight:700;text-align:center;}
  .verdict.ok{background:var(--good-bg);color:var(--good);}
  .verdict.dev{background:var(--warn-bg);color:var(--warn);}

  .drawer-foot{position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:14px 24px;display:flex;gap:10px;justify-content:flex-end;}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy-deep);color:#fff;padding:11px 20px;border-radius:9px;font-size:13.5px;box-shadow:var(--shadow);z-index:100;display:none;}
  .empty-state{text-align:center;padding:50px 20px;color:var(--ink-soft);}
  .checklist{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:10px;background:#fff;}
  .checklist label{display:flex;gap:8px;align-items:flex-start;font-size:12.8px;color:var(--ink);}
  .checklist label small{display:block;color:var(--ink-soft);}
  .link-btn{background:none;border:none;color:var(--navy);text-decoration:underline;font-size:13px;padding:0;}
  .tag{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:20px;background:#eef0f4;color:var(--navy-deep);margin-right:4px;}
  .admin-panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:640px){.grid2{grid-template-columns:1fr;}}
  .loader{display:flex;align-items:center;justify-content:center;min-height:60vh;color:var(--ink-soft);font-size:14px;}
</style>
</head>
<body>
<div id="app"><div class="loader">Yükleniyor…</div></div>
<div class="toast" id="toast"></div>
<script src="data.js?v=3"></script>
<script type="module" src="app.js?v=3"></script>
</body>
</html>
